<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 560" width="1560" height="560" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202f"/>
      <stop offset="1" stop-color="#1e2c44"/>
    </linearGradient>
    <linearGradient id="plcG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#6b9bff"/>
    </linearGradient>
    <linearGradient id="nrG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f4b3a"/>
      <stop offset="1" stop-color="#c4654c"/>
    </linearGradient>
    <linearGradient id="mqttG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#a48bff"/>
    </linearGradient>
    <linearGradient id="webG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fa97b"/>
      <stop offset="1" stop-color="#3fd6a0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ea6d6"/>
    </marker>
  </defs>
  <rect width="1560" height="560" fill="url(#bg2)"/>

  <text x="50" y="48" fill="#ffffff" font-size="25" font-weight="bold">Class-23（2026-11-05）系統架構：FX5U Modbus TCP ＋ Node-RED ＋ MQTT／M2M</text>
  <text x="50" y="76" fill="#93a9cf" font-size="14">讀取流程使用 FC1／FC3，寫入流程使用 FC5／FC6／FC15／FC16；詳細內容見 Class-23-2026-11-05/README.md</text>

  <!-- ==================== FX5U PLC ==================== -->
  <g>
    <rect x="50" y="150" width="300" height="230" rx="16" fill="url(#plcG)" opacity="0.95"/>
    <text x="200" y="184" fill="#0d1b3a" font-size="19" font-weight="bold" text-anchor="middle">FX5U PLC</text>
    <text x="200" y="208" fill="#0d1b3a" font-size="12" text-anchor="middle">三菱 iQ-F，GX Works3 專案 20261105-2.gx3</text>
    <rect x="68" y="222" width="264" height="26" rx="6" fill="#0d1b3a" opacity="0.28"/>
    <text x="200" y="240" fill="#0d1b3a" font-size="13" text-anchor="middle" font-weight="bold">Modbus TCP Server（unitid 1）</text>
    <text x="72" y="270" fill="#0d1b3a" font-size="12.5">M0 = Modbus 位址 8192</text>
    <text x="72" y="292" fill="#0d1b3a" font-size="12.5">M100～M103 = 位址 8292（4 點）</text>
    <text x="72" y="314" fill="#0d1b3a" font-size="12.5">D100～D103 = 位址 100（4 暫存器）</text>
    <text x="72" y="336" fill="#0d1b3a" font-size="12.5">write 流程節點主機設定：IP130</text>
  </g>

  <!-- ==================== Node-RED ==================== -->
  <g>
    <rect x="430" y="120" width="400" height="290" rx="16" fill="url(#nrG)" opacity="0.95"/>
    <text x="630" y="152" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle">Node-RED</text>
    <text x="630" y="174" fill="#ffe1d9" font-size="12" text-anchor="middle">Modbus 讀／寫流程（fx5u_modbus_read.json、fx5u_modbus_write.json）</text>

    <rect x="446" y="186" width="368" height="44" rx="8" fill="#3a1f18" opacity="0.55"/>
    <text x="630" y="203" fill="#ffffff" font-size="12.5" text-anchor="middle">modbus-read：FC1 讀 M100～M103（8292）</text>
    <text x="630" y="221" fill="#ffffff" font-size="12.5" text-anchor="middle">FC3 讀 D100～D103（100）</text>

    <rect x="446" y="234" width="368" height="44" rx="8" fill="#3a1f18" opacity="0.55"/>
    <text x="630" y="251" fill="#ffffff" font-size="12.5" text-anchor="middle">modbus-flex-write（IP130）：FC5／FC15 寫 M 位</text>
    <text x="630" y="269" fill="#ffffff" font-size="12.5" text-anchor="middle">FC6／FC16 寫 D 暫存器</text>

    <rect x="446" y="282" width="368" height="26" rx="8" fill="#3a1f18" opacity="0.55"/>
    <text x="630" y="300" fill="#ffffff" font-size="12.5" text-anchor="middle">MQTT in／out（broker：Mosquitto，topic 雙向）</text>

    <rect x="446" y="312" width="368" height="26" rx="8" fill="#3a1f18" opacity="0.55"/>
    <text x="630" y="330" fill="#ffffff" font-size="12.5" text-anchor="middle">Dashboard：ui_led（node-red-contrib-ui-led）＋ Chart</text>

    <text x="630" y="360" fill="#ffe1d9" font-size="11.5" text-anchor="middle">Node_Red_setup.bat（npm install -g node-red）</text>
    <text x="630" y="378" fill="#ffe1d9" font-size="11.5" text-anchor="middle">Node_Red_server.bat（node-red）</text>
    <text x="630" y="396" fill="#ffe1d9" font-size="11.5" text-anchor="middle">Web 編輯器：http://localhost:1880</text>
  </g>

  <!-- ==================== Mosquitto Broker ==================== -->
  <g>
    <rect x="910" y="130" width="380" height="200" rx="16" fill="url(#mqttG)" opacity="0.95"/>
    <text x="1100" y="164" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Mosquitto Broker（1.6.12a）</text>
    <text x="1100" y="190" fill="#1b0f33" font-size="13" text-anchor="middle">本機 TCP 1883 埠：publish／subscribe</text>
    <text x="1100" y="214" fill="#1b0f33" font-size="13" text-anchor="middle">驗證工具：MQTT Explorer、MQTTBox、MyMQTT（手機 App）</text>
    <text x="1100" y="238" fill="#1b0f33" font-size="13" text-anchor="middle">設定與教學：MQTT教學一／二 PDF、mqtt_setup.txt</text>
    <text x="1100" y="262" fill="#1b0f33" font-size="13" text-anchor="middle">命令列測試：mosquitto_pub.exe／mosquitto_sub.exe</text>
  </g>

  <!-- ==================== Web Dashboard ==================== -->
  <g>
    <rect x="910" y="360" width="380" height="160" rx="16" fill="url(#webG)" opacity="0.95"/>
    <text x="1100" y="390" fill="#0d3325" font-size="18" font-weight="bold" text-anchor="middle">Web 儀錶板／Chart</text>
    <text x="1100" y="416" fill="#0d3325" font-size="13" text-anchor="middle">ui_led API（LED節點.txt：安裝 node-red-contrib-ui-led）</text>
    <text x="1100" y="440" fill="#0d3325" font-size="13" text-anchor="middle">06.MQTT+Web chart → 07 清空歷史／顯示比數 → 08 雙 Y 軸</text>
    <text x="1100" y="464" fill="#0d3325" font-size="13" text-anchor="middle">WEB課程_004：設定時間開關＋密碼（20261103）</text>
  </g>

  <!-- ==================== arrows & labels ==================== -->
  <g stroke="#8ea6d6" stroke-width="3" fill="none">
    <path d="M350,250 L424,250" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M830,200 L904,200" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M830,430 L904,430" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M1100,330 L1100,354" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  </g>
  <g font-size="12.5" fill="#cfe0ff">
    <text x="352" y="232">Modbus TCP</text>
    <text x="352" y="278" font-size="11" fill="#8ea6d6">讀 502 埠傳回</text>
    <text x="842" y="184">MQTT</text>
    <text x="842" y="226" font-size="11" fill="#8ea6d6">publish／</text>
    <text x="842" y="242" font-size="11" fill="#8ea6d6">subscribe</text>
    <text x="842" y="414">HTTP</text>
    <text x="858" y="456" font-size="11" fill="#8ea6d6">dashboard</text>
    <text x="1116" y="345" font-size="11" fill="#8ea6d6">broker 內部訊息</text>
  </g>

  <!-- ==================== M2M note ==================== -->
  <g>
    <rect x="50" y="430" width="800" height="100" rx="14" fill="#31425f" opacity="0.85"/>
    <text x="74" y="462" fill="#cfe0ff" font-size="15" font-weight="bold">M2M（Machine to Machine）重點</text>
    <text x="74" y="488" fill="#a9bbdc" font-size="13">PLC 之外的多台裝置（手機 App、另一個 Flow、瀏覽器）都透過 MQTT topic 交換狀態，</text>
    <text x="74" y="510" fill="#a9bbdc" font-size="13">不必修改 PLC 端程式即可達成機器對機器的互動。講義：Class-23-2026-11-05-29I4.0-M2M.pdf（第 29 頁起）</text>
  </g>
</svg>
