<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#26324e"/>
    </linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b06cff"/>
      <stop offset="1" stop-color="#d0a1ff"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7aa8ff"/>
    </linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ecc8f"/>
      <stop offset="1" stop-color="#6be3b3"/>
    </linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ffd268"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ea6d6"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <text x="40" y="46" fill="#ffffff" font-size="24" font-weight="bold">Class-28（2026-11-24）｜TM 影像分類 → Node-RED → Modbus FC15</text>
  <text x="40" y="72" fill="#9fb2d8" font-size="13">上半：TM 模型推論與 Rectangle／Circle 判定；下半：base64 影像顯示＋FC15 寫入 M200／M201，搭配機丙 1 PLC 練習</text>

  <!-- 上半：Teachable Machine 影像分類 -->
  <g text-anchor="middle">
    <rect x="40" y="110" width="230" height="92" rx="12" fill="url(#gA)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="155" y="138" fill="#ffffff" font-size="15" font-weight="bold">TM 專案</text>
    <text x="155" y="162" fill="#f4eaff" font-size="11">2026-11-19-2-project.tm</text>
    <text x="155" y="182" fill="#f4eaff" font-size="11">沿用 Class-27（2.1 MB）</text>

    <rect x="330" y="110" width="230" height="92" rx="12" fill="url(#gA)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="445" y="138" fill="#ffffff" font-size="15" font-weight="bold">新模型</text>
    <text x="445" y="162" fill="#f4eaff" font-size="11">G4A8FVg5i（11-24 筆記）</text>
    <text x="445" y="182" fill="#f4eaff" font-size="11">teachablemachine 模型連結</text>

    <rect x="620" y="110" width="230" height="92" rx="12" fill="url(#gB)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="735" y="138" fill="#ffffff" font-size="15" font-weight="bold">瀏覽器端推論</text>
    <text x="735" y="162" fill="#eaf1ff" font-size="11">tfjs + teachablemachine</text>
    <text x="735" y="182" fill="#eaf1ff" font-size="11">tmImage.Webcam／predict</text>

    <rect x="910" y="110" width="250" height="92" rx="12" fill="url(#gB)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="1035" y="138" fill="#ffffff" font-size="15" font-weight="bold">類別判定</text>
    <text x="1035" y="162" fill="#eaf1ff" font-size="11">Rectangle → M200 false</text>
    <text x="1035" y="182" fill="#eaf1ff" font-size="11">Circle → M200 true（score &gt; 0.6）</text>
  </g>
  <g stroke="#8ea6d6" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M270,156 L325,156"/>
    <path d="M560,156 L615,156"/>
    <path d="M850,156 L905,156"/>
  </g>

  <!-- 下半：Node-RED → Modbus FC15 -->
  <g text-anchor="middle">
    <rect x="40" y="270" width="210" height="92" rx="12" fill="url(#gC)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="145" y="298" fill="#ffffff" font-size="15" font-weight="bold">影像顯示</text>
    <text x="145" y="322" fill="#eafff6" font-size="11">data:image/png;base64</text>
    <text x="145" y="342" fill="#eafff6" font-size="11">Dashboard &lt;img&gt; 節點</text>

    <rect x="300" y="270" width="210" height="92" rx="12" fill="url(#gC)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="405" y="298" fill="#ffffff" font-size="15" font-weight="bold">指令轉換</text>
    <text x="405" y="322" fill="#eafff6" font-size="11">function：class／score</text>
    <text x="405" y="342" fill="#eafff6" font-size="11">msg.payload = [M200, true]</text>

    <rect x="560" y="270" width="210" height="92" rx="12" fill="url(#gC)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="665" y="298" fill="#ffffff" font-size="15" font-weight="bold">Modbus 寫入</text>
    <text x="665" y="322" fill="#eafff6" font-size="11">FC15／unitid 1／addr 8392</text>
    <text x="665" y="342" fill="#eafff6" font-size="11">quantity 2 → M200～M201</text>

    <rect x="820" y="270" width="210" height="92" rx="12" fill="url(#gD)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="925" y="298" fill="#ffffff" font-size="15" font-weight="bold">PLC 輸出</text>
    <text x="925" y="322" fill="#fff6e0" font-size="11">FX5U／SM402</text>
    <text x="925" y="342" fill="#fff6e0" font-size="11">M200／M201 線圈</text>
  </g>
  <g stroke="#8ea6d6" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M250,316 L295,316"/>
    <path d="M510,316 L555,316"/>
    <path d="M770,316 L815,316"/>
  </g>

  <!-- PLC 專案輸入 -->
  <path d="M925,262 L925,238" stroke="#ffd268" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
  <rect x="690" y="204" width="470" height="34" rx="8" fill="#23324a" stroke="#ffd268" stroke-width="1.5"/>
  <text x="925" y="227" fill="#ffd268" font-size="11" text-anchor="middle">機丙1 tutorial-1020.gx3／1124.gx3＋20261119-1--SM402-140.gx3</text>

  <!-- 圖例 -->
  <g font-size="12">
    <rect x="40" y="398" width="16" height="16" rx="4" fill="url(#gA)"/>
    <text x="64" y="411" fill="#cdb8ff">TM 模型</text>
    <rect x="170" y="398" width="16" height="16" rx="4" fill="url(#gB)"/>
    <text x="194" y="411" fill="#a8c6ff">瀏覽器推論／判定</text>
    <rect x="360" y="398" width="16" height="16" rx="4" fill="url(#gC)"/>
    <text x="384" y="411" fill="#6be3b3">Node-RED 影像／FC15 流程</text>
    <rect x="600" y="398" width="16" height="16" rx="4" fill="url(#gD)"/>
    <text x="624" y="411" fill="#ffd268">PLC 輸出</text>
    <text x="760" y="411" fill="#9fb2d8">※ 影片：youtube.com/watch?v=C792O5ZDcqA（Class28，2026-11-24，3:02:40）</text>
  </g>
</svg>
